spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

app.jwt.secret=${JWT_SECRET:alquiler-vehiculos-clave-jwt-segura-2026-cambiar-produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Observabilidad y Métricas Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Caching de alto rendimiento (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=catalogo,vehiculos
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Datos de la empresa que aparecen en recibos, comprobantes y reportes
empresa.razon-social=${EMPRESA_RAZON_SOCIAL:PAUL CAR'S - ALQUILER DE VEH\u00CDCULOS}
empresa.nombre-comercial=${EMPRESA_NOMBRE_COMERCIAL:Paul Car's}
# RUC de EJEMPLO con formato peruano válido (11 dígitos). Cámbialo por el real aquí o con la variable de entorno EMPRESA_RUC
empresa.ruc=${EMPRESA_RUC:20601234573}
empresa.direccion=${EMPRESA_DIRECCION:Av. 28 de Julio 489, Miraflores, Lima}
empresa.telefono=${EMPRESA_TELEFONO:+51 959 137 712}
empresa.email=${EMPRESA_EMAIL:info@paulcars.com}
empresa.web=${EMPRESA_WEB:www.paulcars.com}

# Facturación electrónica SUNAT (API de Nubefact). Sin URL y token las boletas se emiten en modo DEMO (sin validez tributaria).
sunat.serie-boleta=${SUNAT_SERIE_BOLETA:B001}
sunat.igv=18
# Serie de las notas de crédito que anulan o corrigen boletas (debe empezar con B y tener 4 caracteres)
sunat.serie-nota-credito=${SUNAT_SERIE_NOTA_CREDITO:BC01}
sunat.nubefact-url=${NUBEFACT_URL:}
sunat.nubefact-token=${NUBEFACT_TOKEN:}

# Política de cancelación y reembolso (esquema habitual de las empresas de alquiler)
politica.horas-reembolso-total=48
politica.horas-reembolso-parcial=24
politica.porcentaje-parcial=50
# Plazo para pagar una reserva aprobada y cancelación automática de las que vencen
politica.plazo-pago-horas=24
politica.horas-antes-recojo-limite-pago=2
# Aunque el recojo sea inmediato, el cliente tiene al menos 1 hora para pagar tras la aprobación
politica.plazo-minimo-pago-horas=1
politica.cancelar-vencidas-auto=${CANCELAR_VENCIDAS_AUTO:true}
# Entrega del vehículo: desde cuántos minutos antes de la hora pactada se puede entregar, y cuánto se espera al cliente
politica.entrega-anticipada-minutos=30
politica.espera-cliente-minutos=60
# Kilometraje: topes de sensatez para evitar errores de digitación del odómetro
# Una unidad disponible con una reserva que se recoge dentro de estas horas no puede enviarse a limpieza
politica.horas-reserva-bloquea-limpieza=24
# Si una unidad sale de servicio, las reservas que se recogen dentro de estos días pasan solas a otra placa libre
politica.dias-reasignar-por-baja=7
# Margen preventivo: con 500 km o menos para su mantenimiento, la unidad no vuelve a salir al recibirla
politica.km-margen-mantenimiento=500
politica.km-maximo-salto-entrega=500
politica.km-maximo-por-dia=1500
# Si el cliente no se presenta dentro de la espera, la reserva pagada se cancela sola como "No se presentó" (sin devolución)
politica.cancelar-no-presentadas-auto=${CANCELAR_NO_PRESENTADAS_AUTO:true}

app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Hardening de Fuga de Información en Errores
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Dirección pública del sitio: la usan los botones de los correos (por ejemplo "Pagar mi reserva")
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Cargos al recibir el vehículo: S/ por cada cuarto de tanque faltante y minutos de tolerancia antes de cobrar retraso
politica.combustible-por-cuarto=25
politica.retraso-tolerancia-minutos=60
